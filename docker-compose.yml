# Docker Compose for acceptance testing against a real Sacrum backend.
#
# Usage:
#   # CLI acceptance tests:
#   docker compose run --rm test-runner
#
#   # GUI acceptance tests (headless Tauri via Xvfb + tauri-driver):
#   docker compose run --rm gui-test-runner
#
#   # Daemon acceptance tests (drives vtb-daemon end-to-end with a mock claude CLI):
#   docker compose run --rm daemon-test-runner
#
#   # Tear down:
#   docker compose down -v

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sacrum_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  sacrum:
    image: ghcr.io/camonz/sacrum:latest
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "ecto://postgres:postgres@postgres/sacrum_prod"
      SECRET_KEY_BASE: "acceptance-test-secret-key-base-that-is-at-least-64-bytes-long-for-phoenix"
      PHX_HOST: "localhost"
      PHX_SERVER: "true"
      PORT: "4000"
    entrypoint: ["/bin/sh", "-c", "chmod -R a+x /app/bin && /app/bin/migrate && exec /app/bin/server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  seeder:
    image: ghcr.io/camonz/sacrum:latest
    user: root
    depends_on:
      sacrum:
        condition: service_healthy
    environment:
      DATABASE_URL: "ecto://postgres:postgres@postgres/sacrum_prod"
      SECRET_KEY_BASE: "acceptance-test-secret-key-base-that-is-at-least-64-bytes-long-for-phoenix"
    volumes:
      - ./docker/seed_test_data.exs:/seed.exs:ro
    entrypoint: ["/bin/sh", "-c", "chmod -R a+x /app/bin && /app/bin/sacrum eval \"$$(cat /seed.exs)\""]
    command: []

  test-runner:
    build:
      context: docker
      dockerfile: test-runner.Dockerfile
    network_mode: "service:sacrum"
    depends_on:
      sacrum:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    environment:
      VTB_URL: "http://localhost:4000"
      VTB_TOKEN: "sac_acceptance-test-token-vertebrae"
      VTB_BINARY: "/app/target/debug/vtb"
      CARGO_HOME: "/cargo"
    volumes:
      - .:/app
      - cargo-cache:/cargo
    working_dir: /app
    command: ["/bin/sh", "-c", "cargo build --bin vtb --quiet && cargo test -p acceptance --test acceptance"]

  daemon-test-runner:
    build:
      context: docker
      dockerfile: daemon-test-runner.Dockerfile
    network_mode: "service:sacrum"
    depends_on:
      sacrum:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    environment:
      VTB_URL: "http://localhost:4000"
      VTB_TOKEN: "sac_acceptance-test-token-vertebrae"
      CARGO_HOME: "/cargo"
    volumes:
      - .:/app
      - cargo-cache:/cargo
      - ./crates/daemon-acceptance/mocks:/mocks
    working_dir: /app
    command: ["/app/docker/daemon-test-entrypoint.sh"]

  gui-test-runner:
    build:
      context: docker
      dockerfile: gui-test-runner.Dockerfile
    network_mode: "service:sacrum"
    depends_on:
      sacrum:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    environment:
      VTB_URL: "http://localhost:4000"
      VTB_TOKEN: "sac_acceptance-test-token-vertebrae"
      TAURI_BASE_URL: "http://localhost:1420"
      CARGO_HOME: "/cargo"
    volumes:
      - .:/app
      - cargo-cache:/cargo
      - ./docker/gui-config.toml:/root/.config/vertebrae/config.toml.base:ro
    working_dir: /app
    command: ["/app/docker/gui-test-entrypoint.sh"]

volumes:
  pgdata:
  cargo-cache:
