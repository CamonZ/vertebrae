name: Build acceptance runtime

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      runner:
        required: true
        type: string
    secrets:
      GHCR_TOKEN:
        required: false

jobs:
  build:
    name: Build acceptance ${{ inputs.suite }}
    # Keep fork pull requests on GitHub-hosted runners.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout vertebrae
        uses: actions/checkout@v5

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v2.38.2

      - name: Verify Docker Compose
        run: docker compose version

      - name: Check acceptance runner contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_acceptance*.py'

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.GHCR_TOKEN || github.token }}

      - name: Load prepared runner image
        uses: ./.github/actions/load-acceptance-image
        with:
          suite: ${{ inputs.suite }}

      - name: Restore acceptance build cache
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/acceptance-build-cache
          key: acceptance-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/*test-runner.Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            acceptance-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/*test-runner.Dockerfile') }}-

      - name: Build suite runtime once
        env:
          VTB_ACCEPTANCE_BUILD_CACHE_DIR: ${{ runner.temp }}/acceptance-build-cache
          VTB_ACCEPTANCE_CACHE_KEY: build-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.suite }}
          VTB_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/test-output/acceptance-build
        run: python3 scripts/acceptance.py ${{ inputs.suite }} --build-only

      - name: Upload immutable suite runtime
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-runtime-${{ inputs.suite }}-${{ github.sha }}
          overwrite: true
          path: test-output/acceptance-build/runtime.tar.gz
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-build-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-output/acceptance-build
            !test-output/acceptance-build/runtime.tar.gz

      - name: Make acceptance build cache readable
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.build-cache.outputs.cache-hit != 'true'
        env:
          SUITE: ${{ inputs.suite }}
          CACHE_DIR: ${{ runner.temp }}/acceptance-build-cache
          IMAGE_HANDOFF: ${{ runner.temp }}/acceptance-image/runner.json
        run: |
          image=$(python3 - "$IMAGE_HANDOFF" "$SUITE" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          handoff = json.loads(Path(sys.argv[1]).read_text())
          identity = handoff["digest"].rsplit(":", 1)[1] if handoff["digest"] else handoff["archive_sha256"]
          print(f"vtb-acceptance-{sys.argv[2]}:{identity}")
          PYTHON
          )
          docker run --rm --network none --user 0 --entrypoint chmod -v "$CACHE_DIR:/cache" "$image" -R a+rX /cache

      - name: Save acceptance build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/acceptance-build-cache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
