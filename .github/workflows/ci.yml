name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, epic/a8dbc95c-atlas-machine-flow]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    container:
      # Reuse the published Linux GUI environment for the Tauri system packages.
      # Update the digest when changing the system dependency baseline.
      image: ghcr.io/camonz/vtb-acceptance-gui@sha256:ef33ca07e2cc413d5912c9a18dd7efc2c039aff9683fe70af81b03eef2ca3ef8
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json

      - name: Restore Rust checks cache
        id: rust-checks-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
          key: rust-checks-v1-${{ runner.arch }}-ef33ca07-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config*') }}-${{ github.sha }}
          restore-keys: rust-checks-v1-${{ runner.arch }}-ef33ca07-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config*') }}-

      - name: Allow the unprivileged build user to write build outputs
        run: chown -R podmantest:podmantest "$GITHUB_WORKSPACE" "$CARGO_HOME"

      - name: Stage Tauri sidecars
        run: |
          runuser --preserve-environment -u podmantest -- env HOME=/home/podmantest \
            SIDECAR_PROFILE=debug npm --prefix crates/gui run tauri:prepare-sidecars

      - name: Run Rust checks
        run: |
          runuser --preserve-environment -u podmantest -- env HOME=/home/podmantest \
            scripts/validate.sh rust-checks

      - name: Save Rust checks cache on master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.rust-checks-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
          key: ${{ steps.rust-checks-cache.outputs.cache-primary-key }}

  rust-coverage:
    name: Rust coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Restore instrumented Rust cache
        id: rust-coverage-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/llvm-cov-target/debug/deps
            target/llvm-cov-target/debug/build
            target/llvm-cov-target/debug/.fingerprint
          key: rust-coverage-v1-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config*') }}-${{ github.sha }}
          restore-keys: rust-coverage-v1-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config*') }}-

      - name: Run instrumented tests and require 75% line coverage
        run: scripts/validate.sh rust-coverage

      - name: Save instrumented Rust cache on master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.rust-coverage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/llvm-cov-target/debug/deps
            target/llvm-cov-target/debug/build
            target/llvm-cov-target/debug/.fingerprint
          key: ${{ steps.rust-coverage-cache.outputs.cache-primary-key }}

  gui-static:
    name: GUI static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json
      - run: npm ci
        working-directory: crates/gui
      - run: npm run test:sidecars && npm run test:cascade && npm run lint && npm run lint:css && npm run typecheck
        working-directory: crates/gui
      - name: Test acceptance orchestration contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_acceptance*.py'

  gui-tests:
    name: GUI tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json
      - run: npm ci
        working-directory: crates/gui
      - name: Run GUI test shard
        run: npx vitest run --shard=${{ matrix.shard }}/4 --maxWorkers=2
        working-directory: crates/gui

  ci:
    name: Check & Test
    if: always()
    needs: [rust, rust-coverage, gui-static, gui-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json, os; results=json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'
