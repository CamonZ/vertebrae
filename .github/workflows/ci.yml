name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check & Test
    runs-on: homelab
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json

      - name: Install GUI dependencies
        run: npm ci
        working-directory: crates/gui

      - name: Run React tests
        run: npm test
        working-directory: crates/gui

      - name: Check formatting
        run: cargo fmt --check

      # The GUI declares vtb/vtb-daemon/vtb-gate as Tauri externalBin
      # sidecars. Stage them before compiling the GUI crate.
      - name: Stage Tauri sidecars
        run: cd crates/gui && SIDECAR_PROFILE=debug npm run tauri:prepare-sidecars

      - name: Test Tauri sidecar staging
        run: cd crates/gui && npm run test:sidecars

      - name: Run clippy
        run: cargo clippy --workspace --exclude acceptance --exclude gui-acceptance --exclude daemon-acceptance -- -D warnings

      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --exclude gui --exclude acceptance --exclude gui-acceptance --exclude daemon-acceptance --fail-under-lines 75
