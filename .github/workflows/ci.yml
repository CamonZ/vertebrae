name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check & Test
    runs-on: homelab
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --check

      # The gui crate declares vtb/vtb-daemon/vtb-gate as Tauri externalBin sidecars, and
      # Tauri's build script fails if those files are missing for the host triple.
      # Stage them before any cargo command that compiles the gui crate (clippy).
      - name: Stage Tauri sidecars
        run: |
          cargo build -p vertebrae-cli -p vertebrae-daemon -p vtb-gate
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p crates/gui/src-tauri/binaries
          cp "target/debug/vtb" "crates/gui/src-tauri/binaries/vtb-${triple}"
          cp "target/debug/vtb-daemon" "crates/gui/src-tauri/binaries/vtb-daemon-${triple}"
          cp "target/debug/vtb-gate" "crates/gui/src-tauri/binaries/vtb-gate-${triple}"

      - name: Run clippy
        run: cargo clippy --workspace --exclude acceptance --exclude gui-acceptance --exclude daemon-acceptance -- -D warnings

      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --exclude gui --exclude acceptance --exclude gui-acceptance --exclude daemon-acceptance --fail-under-lines 75
