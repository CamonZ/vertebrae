name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check & Test
    runs-on: homelab
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui/package-lock.json

      - name: Install GUI dependencies
        run: npm ci
        working-directory: crates/gui

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run authoritative validation
        run: scripts/validate.sh
