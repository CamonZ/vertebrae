name: Publish component updates

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (master or a vX.Y.Z tag)
        required: true
        default: master
        type: string
      cache_epoch:
        description: Cache namespace (use a new value for a cold benchmark, then reuse it)
        default: warm
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      channel_tag: ${{ steps.resolve.outputs.channel_tag }}
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      artifact_tag: ${{ steps.resolve.outputs.artifact_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Read current master channel version
        id: current_master
        run: |
          if current_version="$(curl --fail --location --silent --show-error \
            "https://github.com/${{ github.repository }}/releases/download/channel-master/latest-x86_64-unknown-linux-gnu.json" \
            | jq -r '.components.gui.version // empty')"; then
            printf 'version=%s\n' "$current_version" >> "$GITHUB_OUTPUT"
          else
            printf 'version=\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve channel, version, and artifact release tag
        id: resolve
        env:
          REQUESTED_REF: ${{ inputs.ref || github.ref }}
          PREVIOUS_MASTER_VERSION: ${{ steps.current_master.outputs.version }}
        run: node scripts/resolve-release-metadata.mjs >> "$GITHUB_OUTPUT"

  linux-image:
    name: Prepare Linux release environment
    needs: metadata
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse or provision content-addressed Linux image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          fingerprint="$(sha256sum docker/release.Dockerfile | cut -d ' ' -f 1)"
          image="ghcr.io/$repository/release-linux:$fingerprint"
          manifest="$RUNNER_TEMP/release-image.json"
          if ! docker manifest inspect --verbose "$image" > "$manifest"; then
            docker build --platform linux/amd64 -f docker/release.Dockerfile -t "$image" .
            docker push "$image"
            docker manifest inspect --verbose "$image" > "$manifest"
          fi
          # Resolve the single-platform digest without downloading image layers.
          digest="$(jq -er '.Descriptor.digest' "$manifest")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s@%s\n' "${image%:*}" "$digest" >> "$GITHUB_OUTPUT"

  build:
    needs: [metadata, linux-image]
    name: Build ${{ matrix.target }}
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.os == 'ubuntu-22.04' && needs.linux-image.outputs.image || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    environment:
      name: ${{ needs.metadata.outputs.channel }}
    env:
      UPDATE_CHANNEL: ${{ needs.metadata.outputs.channel }}
      UPDATE_CHANNEL_TAG: ${{ needs.metadata.outputs.channel_tag }}
      UPDATE_VERSION: ${{ needs.metadata.outputs.version }}
      UPDATE_BUILD: ${{ needs.metadata.outputs.build }}
      UPDATE_SHA: ${{ needs.metadata.outputs.source_sha }}
      TAURI_UPDATE_PUBLIC_KEY: ${{ vars.TAURI_UPDATE_PUBLIC_KEY }}
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      TARGET: ${{ matrix.target }}
      SIDECAR_PREBUILT_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
      APPIMAGE_EXTRACT_AND_RUN: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
            gui: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            gui: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            gui: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - name: Restore Rust downloads and build cache
        id: rust-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release/deps
            target/release/build
            target/release/.fingerprint
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/.fingerprint
          key: release-v1-${{ inputs.cache_epoch || 'warm' }}-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.target }}-rust1.97.0-release-${{ hashFiles('docker/release.Dockerfile', 'Cargo.lock', '**/Cargo.toml', '.cargo/config*') }}-${{ needs.metadata.outputs.source_sha }}
          restore-keys: |
            release-v1-${{ inputs.cache_epoch || 'warm' }}-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.target }}-rust1.97.0-release-${{ hashFiles('docker/release.Dockerfile', 'Cargo.lock', '**/Cargo.toml', '.cargo/config*') }}-
      - name: Build uniquely identified component artifacts (once per target)
        id: components
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/build-release-binaries.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: release-assets/
          retention-days: 7
      - uses: actions/setup-node@v4
        if: matrix.gui
        with:
          node-version: 20
      - name: Locate npm download cache
        if: matrix.gui
        id: npm-dir
        run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - name: Restore npm downloads
        if: matrix.gui
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-dir.outputs.path }}
          key: release-npm-v1-${{ inputs.cache_epoch || 'warm' }}-${{ matrix.os }}-${{ runner.arch }}-node20-${{ hashFiles('crates/gui/package-lock.json') }}
      - run: npm ci
        if: matrix.gui
        working-directory: crates/gui
      - name: Set GUI bundle version
        if: matrix.gui
        run: node ../../scripts/configure-gui-release.mjs src-tauri/tauri.conf.json
        working-directory: crates/gui
      - name: Build GUI bundle (macOS)
        if: matrix.gui && matrix.os == 'macos-26'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
          : "${APPLE_SIGNING_IDENTITY:?APPLE_SIGNING_IDENTITY is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER is required}"
          : "${APPLE_KEY_P8:?APPLE_KEY_P8 is required}"

          key_path="$RUNNER_TEMP/apple-api-key.p8"
          umask 077
          printf '%s' "$APPLE_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          trap 'rm -f "$key_path"' EXIT
          export APPLE_API_KEY_PATH="$key_path"

          npm run tauri:build -- --target "$TARGET"
        working-directory: crates/gui
      - name: Build GUI bundle (Linux)
        if: matrix.gui && matrix.os == 'ubuntu-22.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target "$TARGET"
        working-directory: crates/gui
      - uses: actions/upload-artifact@v4
        if: matrix.gui
        with:
          name: gui-${{ matrix.os }}
          path: target/${{ matrix.target }}/release/bundle/
          retention-days: 7

      - name: Record cache and build evidence
        if: always()
        env:
          COMPONENT_BUILD_OUTCOME: ${{ steps.components.outcome }}
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          NPM_CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "### Release build: $TARGET"
            echo "Rust exact cache hit: ${RUST_CACHE_HIT:-false} (partial restores appear in the cache log)"
            echo "npm download cache hit: ${NPM_CACHE_HIT:-not used/miss}"
            echo "Component build step: $COMPONENT_BUILD_OUTCOME (one invocation configured per target)"
            echo "GUI hook uses SIDECAR_PREBUILT_DIR; check its staging records in the build log."
            echo "See job step durations for compilation, packaging, and signing timings."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.metadata.outputs.channel }}
    env:
      UPDATE_CHANNEL: ${{ needs.metadata.outputs.channel }}
      CHANNEL_TAG: ${{ needs.metadata.outputs.channel_tag }}
      UPDATE_VERSION: ${{ needs.metadata.outputs.version }}
      UPDATE_BUILD: ${{ needs.metadata.outputs.build }}
      UPDATE_SHA: ${{ needs.metadata.outputs.source_sha }}
      ARTIFACT_TAG: ${{ needs.metadata.outputs.artifact_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          path: release-input
      - name: Sign artifacts and publish channel metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VTB_UPDATE_PRIVATE_KEY: ${{ secrets.VTB_UPDATE_PRIVATE_KEY }}
          VTB_UPDATE_PUBLIC_KEY: ${{ vars.VTB_UPDATE_PUBLIC_KEY }}
        run: scripts/publish-release-assets.sh
