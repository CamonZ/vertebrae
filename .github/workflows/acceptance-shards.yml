name: Run acceptance shards

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      shards:
        required: true
        type: string
      homelab-shards:
        required: true
        type: string
    secrets:
      GHCR_TOKEN:
        required: false

jobs:
  shards:
    name: Acceptance ${{ inputs.suite }} (${{ matrix.shard }}/${{ strategy.job-total }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    # Keep fork pull requests on GitHub-hosted runners.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || (contains(fromJSON(inputs.homelab-shards), matrix.shard) && 'homelab' || 'ubuntu-latest') }}
    env:
      # Pin the source; bumping it also invalidates the image archive cache.
      POSTGRES_IMAGE_SOURCE: public.ecr.aws/docker/library/postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
      # docker save/load preserves tags, but not registry digest references.
      VTB_ACCEPTANCE_POSTGRES_IMAGE: vtb-acceptance-postgres:ci
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout vertebrae
        uses: actions/checkout@v5

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v2.38.2

      - name: Verify Docker Compose
        run: docker compose version

      - name: Restore Postgres image cache
        id: postgres-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/acceptance-postgres.tar
          key: postgres-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.POSTGRES_IMAGE_SOURCE }}

      - name: Load or pull Postgres image
        env:
          POSTGRES_IMAGE_ARCHIVE: ${{ runner.temp }}/acceptance-postgres.tar
        shell: bash
        run: |
          if [[ -f "$POSTGRES_IMAGE_ARCHIVE" ]] && docker load --input "$POSTGRES_IMAGE_ARCHIVE"; then
            docker image inspect "$VTB_ACCEPTANCE_POSTGRES_IMAGE" > /dev/null
          else
            docker pull "$POSTGRES_IMAGE_SOURCE"
            docker tag "$POSTGRES_IMAGE_SOURCE" "$VTB_ACCEPTANCE_POSTGRES_IMAGE"
            docker save --output "$POSTGRES_IMAGE_ARCHIVE" "$VTB_ACCEPTANCE_POSTGRES_IMAGE"
          fi

      # Save before the suites, so a later test failure does not discard a miss.
      - name: Save Postgres image cache
        if: steps.postgres-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/acceptance-postgres.tar
          key: ${{ steps.postgres-cache.outputs.cache-primary-key }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.GHCR_TOKEN || github.token }}

      - name: Load prepared runner image
        uses: ./.github/actions/load-acceptance-image
        with:
          suite: ${{ inputs.suite }}

      - name: Download suite runtime
        uses: actions/download-artifact@v7
        with:
          name: acceptance-runtime-${{ inputs.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance-runtime

      - name: Run acceptance suites
        env:
          # Shards own disposable state and execute the immutable suite build.
          VTB_ACCEPTANCE_CACHE_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.suite }}-${{ matrix.shard }}
          VTB_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/test-output/acceptance
        run: python3 scripts/acceptance.py ${{ inputs.suite }} --prebuilt "${{ runner.temp }}/acceptance-runtime/runtime.tar.gz" --shard-index ${{ matrix.shard }} --shard-count ${{ strategy.job-total }}

      - name: Ensure acceptance resources are removed
        if: always()
        env:
          VTB_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/test-output/acceptance
        run: python3 scripts/acceptance.py --cleanup

      - name: Upload acceptance diagnostics and timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: acceptance-${{ inputs.suite }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/acceptance
          if-no-files-found: warn
