name: Prepare acceptance images

on:
  workflow_call:

jobs:
  prepare:
    name: Prepare ${{ matrix.suite }} runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        suite: [cli, daemon, gui]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR with read access
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve or build runner image
        env:
          VTB_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/test-output/acceptance-images
        run: python3 scripts/acceptance.py ${{ matrix.suite }} --prepare-image "${{ runner.temp }}/acceptance-image"

      - name: Upload runner image handoff
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-image-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance-image
          if-no-files-found: error
          overwrite: true
          compression-level: 1

      - name: Upload runner image diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-image-diagnostics-${{ matrix.suite }}-${{ github.run_attempt }}
          path: test-output/acceptance-images
          if-no-files-found: warn
