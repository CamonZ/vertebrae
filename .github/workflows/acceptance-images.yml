name: Publish acceptance images

# Runner images are tagged by their Dockerfile digest, so only a Dockerfile
# change produces a new image. Acceptance runs pull them and build locally only
# when the digest is not published yet. Digest tags are immutable per content,
# so a PR may publish the images it introduces for its own later runs.
on:
  push:
    branches: [master]
    paths:
      - "docker/*.Dockerfile"
      - "scripts/acceptance.py"
      - ".github/workflows/acceptance-images.yml"
  pull_request:
    branches: [master]
    paths:
      - "docker/*.Dockerfile"
      - "scripts/acceptance.py"
      - ".github/workflows/acceptance-images.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish acceptance images
    # Same architecture as the acceptance runners that pull these images.
    runs-on: homelab
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout vertebrae
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unpublished runner images
        env:
          VTB_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/test-output/acceptance-images
        run: python3 scripts/acceptance.py --publish-images
