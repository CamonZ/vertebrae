name: Acceptance Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  cli-acceptance:
    name: CLI Acceptance Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout vertebrae
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run CLI acceptance tests
        run: docker compose run --rm test-runner

      - name: Tear down
        if: always()
        run: docker compose down -v

  gui-acceptance:
    name: GUI Acceptance Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout vertebrae
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run GUI acceptance tests
        run: docker compose run --rm gui-test-runner

      - name: Tear down
        if: always()
        run: docker compose down -v
