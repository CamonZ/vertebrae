name: Acceptance Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  acceptance:
    name: Acceptance Tests
    runs-on: homelab
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout vertebrae
        uses: actions/checkout@v4

      - name: Install Docker Compose plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m) -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run acceptance suites
        env:
          # One job per runner; retain its compilation cache across checkouts.
          VTB_ACCEPTANCE_CACHE_KEY: ${{ runner.name }}
          VTB_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/test-output/acceptance
        run: python3 scripts/acceptance.py

      - name: Ensure acceptance resources are removed
        if: always()
        env:
          VTB_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/test-output/acceptance
        run: python3 scripts/acceptance.py --cleanup

      - name: Upload acceptance diagnostics and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/acceptance
          if-no-files-found: warn
