name: Acceptance Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  colima:
    name: Colima GUI project setup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      COLIMA_VERSION: v0.10.3
      VTB_ACCEPTANCE_CACHE_KEY: colima-${{ github.run_id }}-${{ github.run_attempt }}
      VTB_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/test-output/colima
    steps:
      - name: Checkout vertebrae
        uses: actions/checkout@v4

      - name: Check acceptance runner contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_acceptance*.py'

      - name: Set up Lima, QEMU and KVM
        uses: lima-vm/lima-actions/setup@1be8c646a08d3a8c1186531108508cde33394b52 # v1
        with:
          version: v2.2.0
          ssh: false

      - name: Install Colima
        shell: bash
        run: |
          download_dir="$RUNNER_TEMP/colima-download"
          mkdir -p "$download_dir"
          cd "$download_dir"
          release_url="https://github.com/abiosoft/colima/releases/download/$COLIMA_VERSION"
          curl --fail --location --retry 3 --output colima-Linux-x86_64 "$release_url/colima-Linux-x86_64"
          curl --fail --location --retry 3 --output colima-Linux-x86_64.sha256sum "$release_url/colima-Linux-x86_64.sha256sum"
          sha256sum --check colima-Linux-x86_64.sha256sum
          sudo install -m 0755 colima-Linux-x86_64 /usr/local/bin/colima

      - name: Start real Colima Docker engine
        shell: bash
        run: |
          mkdir -p "$VTB_ACCEPTANCE_OUTPUT"
          colima start --runtime docker --mount-type 9p --cpus 2 --memory 5 --disk 60 --mount "$HOME:w" 2>&1 | tee "$VTB_ACCEPTANCE_OUTPUT/colima-start.log"
          colima status
          docker version
          docker compose version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run GUI project setup through Colima
        run: python3 scripts/acceptance-colima.py

      - name: Remove Colima VM and its test data
        if: always()
        shell: bash
        run: |
          mkdir -p "$VTB_ACCEPTANCE_OUTPUT"
          if command -v colima >/dev/null 2>&1; then
            colima delete --force --data 2>&1 | tee "$VTB_ACCEPTANCE_OUTPUT/colima-cleanup.log"
          fi

      - name: Upload Colima GUI diagnostics and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colima-gui-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/colima
          if-no-files-found: warn

  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-24.04
    env:
      # Pin the source; bumping it also invalidates the image archive cache.
      POSTGRES_IMAGE_SOURCE: public.ecr.aws/docker/library/postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
      # docker save/load preserves tags, but not registry digest references.
      VTB_ACCEPTANCE_POSTGRES_IMAGE: vtb-acceptance-postgres:ci
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout vertebrae
        uses: actions/checkout@v4

      - name: Verify Docker Compose
        run: docker compose version

      - name: Restore Postgres image cache
        id: postgres-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/acceptance-postgres.tar
          key: postgres-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.POSTGRES_IMAGE_SOURCE }}

      - name: Load or pull Postgres image
        env:
          POSTGRES_IMAGE_ARCHIVE: ${{ runner.temp }}/acceptance-postgres.tar
        shell: bash
        run: |
          if [[ -f "$POSTGRES_IMAGE_ARCHIVE" ]] && docker load --input "$POSTGRES_IMAGE_ARCHIVE"; then
            docker image inspect "$VTB_ACCEPTANCE_POSTGRES_IMAGE" > /dev/null
          else
            docker pull "$POSTGRES_IMAGE_SOURCE"
            docker tag "$POSTGRES_IMAGE_SOURCE" "$VTB_ACCEPTANCE_POSTGRES_IMAGE"
            docker save --output "$POSTGRES_IMAGE_ARCHIVE" "$VTB_ACCEPTANCE_POSTGRES_IMAGE"
          fi

      # Save before the suites, so a later test failure does not discard a miss.
      - name: Save Postgres image cache
        if: steps.postgres-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/acceptance-postgres.tar
          key: ${{ steps.postgres-cache.outputs.cache-primary-key }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run acceptance suites
        env:
          # Isolate build caches for this disposable GitHub-hosted job.
          VTB_ACCEPTANCE_CACHE_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          VTB_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/test-output/acceptance
        run: python3 scripts/acceptance.py

      - name: Ensure acceptance resources are removed
        if: always()
        env:
          VTB_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/test-output/acceptance
        run: python3 scripts/acceptance.py --cleanup

      - name: Upload acceptance diagnostics and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/acceptance
          if-no-files-found: warn
