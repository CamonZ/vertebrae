name: Acceptance Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, epic/a8dbc95c-atlas-machine-flow]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-image:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/acceptance-images.yml
    with:
      suite: cli

  cli-build:
    needs: [cli-image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/acceptance-build.yml
    with:
      suite: cli
      runner: ubuntu-latest
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  cli-runtime:
    needs: [cli-image]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/acceptance-runtime-ready.yml
    with:
      suite: cli

  cli-shards:
    needs: [cli-runtime]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/acceptance-shards.yml
    with:
      suite: cli
      shards: '[1, 2]'
      homelab-shards: '[2]'
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  daemon-image:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/acceptance-images.yml
    with:
      suite: daemon

  daemon-build:
    needs: [daemon-image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/acceptance-build.yml
    with:
      suite: daemon
      runner: ubuntu-latest
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  daemon-runtime:
    needs: [daemon-image]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/acceptance-runtime-ready.yml
    with:
      suite: daemon

  daemon-shards:
    needs: [daemon-runtime]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/acceptance-shards.yml
    with:
      suite: daemon
      shards: '[1, 2, 3, 4, 5, 6]'
      homelab-shards: '[2, 4]'
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  gui-image:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/acceptance-images.yml
    with:
      suite: gui

  gui-build:
    needs: [gui-image]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/acceptance-build.yml
    with:
      suite: gui
      runner: homelab
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  gui-runtime:
    needs: [gui-image]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/acceptance-runtime-ready.yml
    with:
      suite: gui

  gui-shards:
    needs: [gui-runtime]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/acceptance-shards.yml
    with:
      suite: gui
      shards: '[1, 2, 3, 4, 5, 6, 7, 8]'
      homelab-shards: '[2, 4, 8]'
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [cli-image, daemon-image, gui-image]
    name: Publish ${{ matrix.suite }} runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        suite: [cli, daemon, gui]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: acceptance-image-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance-image

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish prepared runner if missing
        run: python3 scripts/acceptance.py ${{ matrix.suite }} --publish-prepared-image "${{ runner.temp }}/acceptance-image"

  colima:
    needs: [gui-image]
    name: Colima GUI project setup
    # The x64 QEMU guest stalled during image pulls and imports on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      COLIMA_VERSION: v0.10.3
      VTB_ACCEPTANCE_CACHE_KEY: colima-${{ github.run_id }}-${{ github.run_attempt }}
      VTB_ACCEPTANCE_OUTPUT: ${{ github.workspace }}/test-output/colima
    steps:
      - name: Checkout vertebrae
        uses: actions/checkout@v5

      - name: Check acceptance runner contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_acceptance*.py'

      - name: Set up Lima, QEMU and KVM
        uses: lima-vm/lima-actions/setup@1be8c646a08d3a8c1186531108508cde33394b52 # v1
        with:
          version: v2.2.0
          ssh: false

      - name: Install Colima
        shell: bash
        run: |
          download_dir="$RUNNER_TEMP/colima-download"
          mkdir -p "$download_dir"
          cd "$download_dir"
          release_url="https://github.com/abiosoft/colima/releases/download/$COLIMA_VERSION"
          curl --fail --location --retry 3 --output colima-Linux-x86_64 "$release_url/colima-Linux-x86_64"
          curl --fail --location --retry 3 --output colima-Linux-x86_64.sha256sum "$release_url/colima-Linux-x86_64.sha256sum"
          sha256sum --check colima-Linux-x86_64.sha256sum
          sudo install -m 0755 colima-Linux-x86_64 /usr/local/bin/colima

      - name: Start real Colima Docker engine
        shell: bash
        run: |
          mkdir -p "$VTB_ACCEPTANCE_OUTPUT"
          colima start --runtime docker --mount-type 9p --cpus 2 --memory 5 --disk 60 --mount "$HOME:w" 2>&1 | tee "$VTB_ACCEPTANCE_OUTPUT/colima-start.log"
          colima status
          docker version
          docker compose version

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.GHCR_TOKEN || github.token }}

      - name: Load prepared runner image into Colima
        timeout-minutes: 5
        env:
          DOCKER_CONTEXT: colima
        uses: ./.github/actions/load-acceptance-image
        with:
          suite: gui

      - name: Wait for the GUI runtime upload
        timeout-minutes: 40
        uses: ./.github/actions/wait-acceptance-runtime
        with:
          suite: gui

      - name: Download GUI suite runtime
        uses: actions/download-artifact@v7
        with:
          name: acceptance-runtime-gui-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance-runtime

      - name: Run GUI project setup through Colima
        run: python3 scripts/acceptance-colima.py --prebuilt "${{ runner.temp }}/acceptance-runtime/runtime.tar.gz"

      - name: Capture Colima diagnostics on failure
        if: failure()
        timeout-minutes: 1
        shell: bash
        run: |
          mkdir -p "$VTB_ACCEPTANCE_OUTPUT"
          sudo dmesg --ctime > "$VTB_ACCEPTANCE_OUTPUT/host-kernel.log" 2>&1 || true
          lima_dir="$HOME/.config/colima/_lima/colima"
          if [[ -d "$lima_dir" ]]; then
            find "$lima_dir" -maxdepth 1 -type f -name '*.log' -exec cp {} "$VTB_ACCEPTANCE_OUTPUT/" \;
            timeout 15s colima ssh -- sudo journalctl -u docker --no-pager -n 300 \
              > "$VTB_ACCEPTANCE_OUTPUT/guest-docker.log" 2>&1 || true
          fi

      - name: Remove Colima VM and its test data
        if: always()
        shell: bash
        run: |
          mkdir -p "$VTB_ACCEPTANCE_OUTPUT"
          if command -v colima >/dev/null 2>&1; then
            colima delete --force --data 2>&1 | tee "$VTB_ACCEPTANCE_OUTPUT/colima-cleanup.log"
          fi

      - name: Upload Colima GUI diagnostics and timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: colima-gui-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output/colima
          if-no-files-found: warn

  acceptance-summary:
    name: Acceptance Tests
    if: always()
    needs: [cli-build, cli-shards, daemon-build, daemon-shards, gui-build, gui-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Require every acceptance build and shard
        env:
          ALL_SUCCEEDED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: test "$ALL_SUCCEEDED" = true
