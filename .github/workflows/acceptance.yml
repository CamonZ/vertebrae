name: Acceptance Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  acceptance:
    name: Acceptance Tests
    runs-on: homelab
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout vertebrae
        uses: actions/checkout@v4

      - name: Install Docker Compose plugin
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m) -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run CLI acceptance tests
        id: cli
        continue-on-error: true
        run: docker compose run --rm test-runner

      - name: Run GUI acceptance tests
        id: gui
        continue-on-error: true
        run: docker compose run --rm gui-test-runner

      - name: Run daemon acceptance tests
        id: daemon
        continue-on-error: true
        run: docker compose run --rm daemon-test-runner

      - name: Report acceptance results
        if: always()
        run: |
          cli="${{ steps.cli.outcome }}"
          gui="${{ steps.gui.outcome }}"
          daemon="${{ steps.daemon.outcome }}"
          echo "CLI:    $cli"
          echo "GUI:    $gui"
          echo "Daemon: $daemon"
          [ "$cli" = "success" ] && [ "$gui" = "success" ] && [ "$daemon" = "success" ]

      - name: Tear down
        if: always()
        run: docker compose down -v
