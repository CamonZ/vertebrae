# Local DEV backend (sacrum) reachable from the host on http://localhost:4000.
#
# This is a standalone stack (own project name + own volume), so it never
# collides with the acceptance stack in docker-compose.yml.
#
# Most people should use the wrapper, which also seeds + writes app config:
#   scripts/dev-backend.sh up
#
# Raw compose usage:
#   # Start postgres + sacrum + seed a dev user/token (override creds via env):
#   docker compose -f docker-compose.dev.yml up -d
#
#   # Use your own credentials/token:
#   SEED_EMAIL=me@local.test SEED_PASSWORD=hunter2 SEED_TOKEN=sac_my-dev-token \
#     docker compose -f docker-compose.dev.yml up -d
#
#   # Re-run just the seeder (e.g. after changing creds):
#   docker compose -f docker-compose.dev.yml run --rm seeder
#
#   # Tail logs / check health:
#   docker compose -f docker-compose.dev.yml ps
#   curl -f http://localhost:4000/healthz
#
#   # Tear down (drops the DB volume):
#   docker compose -f docker-compose.dev.yml down -v

name: vertebrae-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sacrum_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  sacrum:
    image: ghcr.io/camonz/sacrum:latest
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "ecto://postgres:postgres@postgres/sacrum_prod"
      SECRET_KEY_BASE: "dev-secret-key-base-that-is-at-least-64-bytes-long-for-phoenix-app"
      PHX_HOST: "localhost"
      PHX_SERVER: "true"
      PORT: "4000"
    # Publish to the host so your local vtb / GUI / daemon can reach it.
    ports:
      - "4000:4000"
    entrypoint: ["/bin/sh", "-c", "chmod -R a+x /app/bin && /app/bin/migrate && exec /app/bin/server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  seeder:
    image: ghcr.io/camonz/sacrum:latest
    user: root
    depends_on:
      sacrum:
        condition: service_healthy
    environment:
      DATABASE_URL: "ecto://postgres:postgres@postgres/sacrum_prod"
      SECRET_KEY_BASE: "dev-secret-key-base-that-is-at-least-64-bytes-long-for-phoenix-app"
      SEED_EMAIL: "${SEED_EMAIL:-dev@local.test}"
      SEED_USERNAME: "${SEED_USERNAME:-dev}"
      SEED_PASSWORD: "${SEED_PASSWORD:-dev_password_123}"
      SEED_TOKEN: "${SEED_TOKEN:-sac_dev-local-token}"
    volumes:
      - ./docker/seed_dev_data.exs:/seed.exs:ro
    entrypoint: ["/bin/sh", "-c", "chmod -R a+x /app/bin && /app/bin/sacrum eval \"$$(cat /seed.exs)\""]

volumes:
  pgdata:
