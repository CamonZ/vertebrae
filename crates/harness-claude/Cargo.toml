[package]
name = "vertebrae-harness-claude"
version = "0.1.0"
edition = "2024"
description = "Claude Code CLI runtime for Vertebrae harness consumers"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
vertebrae-harness-core = { path = "../harness-core" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
