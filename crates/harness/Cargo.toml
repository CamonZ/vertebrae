[package]
name = "vertebrae-harness"
version = "0.1.0"
edition = "2024"
description = "Provider-selecting composition layer for the V1 harness contract"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt"] }
vertebrae-credentials = { path = "../credentials" }
serde_json = "1"
vertebrae-core = { path = "../core" }
vertebrae-harness-claude = { path = "../harness-claude" }
vertebrae-harness-codex = { path = "../harness-codex" }
vertebrae-harness-core = { path = "../harness-core" }
vertebrae-harness-typesafe = { path = "../harness-typesafe" }
vertebrae-harness-mistral-vibe = { path = "../harness-mistral-vibe" }

[dev-dependencies]
json-patch = "3"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "time"] }

[lints]
workspace = true
