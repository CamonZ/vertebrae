[package]
name = "vertebrae-harness-core"
version = "0.1.0"
edition = "2024"
description = "Provider-neutral runtime and event contracts for AI harnesses"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time"] }
uuid = { version = "1", features = ["v4", "v5"] }
vertebrae-core = { path = "../core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt", "time"] }
