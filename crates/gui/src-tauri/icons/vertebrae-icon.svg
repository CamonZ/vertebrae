<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a1c"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Orange glow gradient -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Spine gradient -->
    <linearGradient id="spineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Filter for subtle glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bgGradient)"/>

  <!-- Subtle border -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Orange glow behind icon -->
  <ellipse cx="512" cy="512" rx="240" ry="300" fill="url(#glowGradient)"/>

  <!-- Exact same icon as in-app (Sidebar.tsx), scaled and centered -->
  <!-- Original viewBox is 0 0 24 24, we scale by 28 and center at 512,512 -->
  <!-- Transform: translate to center, then scale -->
  <g transform="translate(512, 512) scale(28)"
     stroke="url(#spineGradient)"
     stroke-width="1.5"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round"
     filter="url(#glow)">
    <!-- Exact paths from Sidebar.tsx, centered at origin (subtract 12 from x coords) -->
    <!-- Original: M12 2v20 M12 6c-2 0-3.5 1-3.5 2s1.5 2 3.5 2 3.5-1 3.5-2-1.5-2-3.5-2z -->
    <path d="M0 -10v20 M0 -6c-2 0-3.5 1-3.5 2s1.5 2 3.5 2 3.5-1 3.5-2-1.5-2-3.5-2z"/>
    <!-- Original: M12 10c-2 0-3.5 1-3.5 2s1.5 2 3.5 2 3.5-1 3.5-2-1.5-2-3.5-2z -->
    <path d="M0 -2c-2 0-3.5 1-3.5 2s1.5 2 3.5 2 3.5-1 3.5-2-1.5-2-3.5-2z"/>
    <!-- Original: M12 14c-2 0-3.5 1-3.5 2s1.5 2 3.5 2 3.5-1 3.5-2-1.5-2-3.5-2z -->
    <path d="M0 2c-2 0-3.5 1-3.5 2s1.5 2 3.5 2 3.5-1 3.5-2-1.5-2-3.5-2z"/>
  </g>
</svg>
