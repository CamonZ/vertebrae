[package]
name = "gui"
version = "0.1.0"
description = "Vertebrae GUI - A Tauri-based graphical interface for Vertebrae"
authors = ["Vertebrae Team"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"
default-run = "gui"

[lib]
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gui"
path = "src/main.rs"

[[bin]]
name = "generate-types"
path = "src/bin/generate-types.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
semver = "1"
log = "0.4"
thiserror = "2"
tauri = { version = "2.11.5", features = ["macos-private-api", "specta"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["native-tls", "zip"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
dirs = "6"

# Type generation for frontend bindings
specta = { version = "=2.0.0-rc.22", features = ["derive", "function", "tokio", "serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tokio = { version = "1", features = ["full"] }

# Async stream processing
futures = "0.3"

# Workspace dependencies
vertebrae-core = { path = "../../core" }
vertebrae-harness = { path = "../../harness" }
vertebrae-sacrum-client = { path = "../../sacrum-client" }
vertebrae-installer = { path = "../../installer" }
vertebrae-skills-assets = { path = "../../skills-assets" }
vertebrae-harness-core = { path = "../../harness-core" }
slug = "0.1"

# Async trait support for testing
async-trait = "0.1"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# PTY for terminal emulation
portable-pty = "0.8"

# Base64 encoding for PTY data transfer
base64 = "0.22"
ed25519-dalek = "2"
fs2 = "0.4"
getrandom = "0.2"
sha2 = "0.10"
zeroize = "1"

# WebSocket support for Phoenix channels
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
url = "2.5"
uuid = { version = "1.0", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSURL"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTCoreTypes", "UTType"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
serial_test = "3"
