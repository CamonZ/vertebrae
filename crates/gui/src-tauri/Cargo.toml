[package]
name = "gui"
version = "0.1.0"
description = "Vertebrae GUI - A Tauri-based graphical interface for Vertebrae"
authors = ["Vertebrae Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5" }
tauri-plugin-log = "2"

# Workspace dependencies
vertebrae-db = { path = "../../db" }
