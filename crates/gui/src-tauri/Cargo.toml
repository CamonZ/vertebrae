[package]
name = "gui"
version = "0.1.0"
description = "Vertebrae GUI - A Tauri-based graphical interface for Vertebrae"
authors = ["Vertebrae Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "gui"

[lib]
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gui"
path = "src/main.rs"

[[bin]]
name = "generate-types"
path = "src/bin/generate-types.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
thiserror = "2"
tauri = { version = "2.9.5", features = ["specta"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
dirs = "6"

# Type generation for frontend bindings
specta = { version = "=2.0.0-rc.22", features = ["derive", "function", "tokio", "serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tokio = { version = "1", features = ["full"] }

# Async stream processing
futures = "0.3"

# Workspace dependencies
vertebrae-core = { path = "../../core" }
vertebrae-sacrum-client = { path = "../../sacrum-client" }
slug = "0.1"

# Async trait support for testing
async-trait = "0.1"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# PTY for terminal emulation
portable-pty = "0.8"

# Base64 encoding for PTY data transfer
base64 = "0.22"

# WebSocket support for Phoenix channels
tungstenite = "0.24"
tokio-tungstenite = "0.24"
url = "2.5"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tauri = { version = "2.9.5", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
