[package]
name = "gui"
version = "0.1.0"
description = "Vertebrae GUI - A Tauri-based graphical interface for Vertebrae"
authors = ["Vertebrae Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "gui"

[lib]
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gui"
path = "src/main.rs"

[[bin]]
name = "generate-types"
path = "src/bin/generate-types.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
thiserror = "2"
tauri = { version = "2.9.5", features = ["specta"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
dirs = "6"

# Type generation for frontend bindings
specta = { version = "=2.0.0-rc.22", features = ["derive", "function", "tokio"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tokio = { version = "1", features = ["full"] }

# Workspace dependencies
vertebrae-db = { path = "../../db" }
