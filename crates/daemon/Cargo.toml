[package]
name = "vertebrae-daemon"
version = "0.1.0"
edition = "2024"
description = "Workflow execution daemon for Vertebrae using ractor actor framework"
license = "MIT"

[lib]
name = "vertebrae_daemon"
path = "src/lib.rs"

[[bin]]
name = "vtb-daemon"
path = "src/main.rs"

[dependencies]
futures = "0.3"
ractor = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
vertebrae-core = { path = "../core" }
vertebrae-sacrum-client = { path = "../sacrum-client" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
