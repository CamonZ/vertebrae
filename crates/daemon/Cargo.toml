[package]
name = "vertebrae-daemon"
version = "0.1.0"
edition = "2024"
description = "Workflow execution daemon for Vertebrae using ractor actor framework"
license = "MIT"

[dependencies]
ractor = "0.15"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
vertebrae-core = { path = "../core" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
