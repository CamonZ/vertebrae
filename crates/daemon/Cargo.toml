[package]
name = "vertebrae-daemon"
version = "0.1.0"
edition = "2024"
description = "Workflow execution daemon for Vertebrae using ractor actor framework"
license = "Apache-2.0"

[lib]
name = "vertebrae_daemon"
path = "src/lib.rs"

[[bin]]
name = "vtb-daemon"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
jsonschema = { version = "0.30", default-features = false }
reqwest = { version = "0.13", features = ["json", "stream"] }
ractor = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
vertebrae-core = { path = "../core" }
vertebrae-harness = { path = "../harness" }
vertebrae-harness-core = { path = "../harness-core" }
vertebrae-installer = { path = "../installer" }
vertebrae-sacrum-client = { path = "../sacrum-client" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
