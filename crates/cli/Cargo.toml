[package]
name = "vertebrae-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for Vertebrae task management"
license = "MIT"

[lib]
name = "vertebrae_cli"
path = "src/lib.rs"

[[bin]]
name = "vtb"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v7"] }
vertebrae-core = { path = "../core" }
vertebrae-sacrum-client = { path = "../sacrum-client" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
toml = "0.8"
slug = "0.1"

[dev-dependencies]
serial_test = "3"
vertebrae-core = { path = "../core", features = ["test-utils"] }

[[test]]
name = "integration_tests"
path = "tests/integration_tests/mod.rs"
