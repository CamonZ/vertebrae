[package]
name = "vertebrae-github"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
description = "Read-only GitHub GraphQL adapter with gh CLI authentication"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
percent-encoding = "2.3"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true
