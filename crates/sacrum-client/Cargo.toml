[package]
name = "vertebrae-sacrum-client"
version = "0.1.0"
edition = "2024"
description = "HTTP client for Sacrum backend"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
thiserror = "2"
toml = "0.9"
log = "0.4"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
sha2 = "0.10"

vertebrae-core = { path = "../core" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
serial_test = "3"
tempfile = "3"
