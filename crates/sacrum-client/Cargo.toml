[package]
name = "vertebrae-sacrum-client"
version = "0.1.0"
edition = "2024"
description = "HTTP client for Sacrum backend"
license = "MIT"

[dependencies]
reqwest = { version = "0.11", features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
thiserror = "2"
toml = "0.8"
tracing = "0.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

vertebrae-core = { path = "../core" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
