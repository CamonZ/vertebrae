[package]
name = "daemon-acceptance"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
vertebrae-sacrum-client = { path = "../sacrum-client" }
vertebrae-core = { path = "../core" }
cucumber = "0.22"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"

[[bin]]
name = "mock-claude"
path = "src/bin/mock_claude.rs"

[[bin]]
name = "mock-codex"
path = "src/bin/mock_codex.rs"

[[test]]
name = "daemon_acceptance"
harness = false
