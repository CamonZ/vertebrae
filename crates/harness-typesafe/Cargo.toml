[package]
name = "vertebrae-harness-typesafe"
version = "0.1.0"
edition = "2024"
description = "TypeSafe System One HTTP client for the Vertebrae harness"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
vertebrae-harness-core = { path = "../harness-core" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
