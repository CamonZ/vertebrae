[package]
name = "vertebrae-core"
version = "0.1.0"
edition = "2024"
description = "Core service layer for Vertebrae task management"
license = "Apache-2.0"

[features]
default = []

[dependencies]
thiserror = "2"
async-trait = "0.1"
sha2 = "0.10"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
