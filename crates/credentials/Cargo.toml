[package]
name = "vertebrae-credentials"
version = "0.1.0"
edition = "2024"
description = "OS-backed credential storage shared by Vertebrae application surfaces"
license = "Apache-2.0"

[dependencies]
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[lints]
workspace = true
