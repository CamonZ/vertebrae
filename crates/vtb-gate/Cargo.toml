[package]
name = "vtb-gate"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "vtb-gate"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
