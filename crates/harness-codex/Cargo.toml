[package]
name = "vertebrae-harness-codex"
version = "0.1.0"
edition = "2024"
description = "Codex App Server runtime for Vertebrae harness consumers"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
vertebrae-harness-core = { path = "../harness-core" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
