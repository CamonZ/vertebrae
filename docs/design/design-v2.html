<!doctype html>
<!-- @dsCard group="Brand" name="Design v2 (Hearth)" subtitle="Workflow graph with runtime overlay" viewport="1440x900" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vertebrae · Hearth — Design (v2 · components)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components-v2.css">
<link rel="stylesheet" href="lib/components-lib.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; font-size: var(--text-13); }
  #root { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ── Design main: 3 panes ── */
  .design-main { flex: 1; display: flex; min-width: 0; position: relative; }

  /* Workflow list (left rail) */
  .wf-list { width: 320px; flex-shrink: 0; border-right: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
  .wf-list-head { padding: var(--s-4) var(--s-4) var(--s-3); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s-3); }
  .wf-list-head .h-title { font-family: var(--mono); font-size: var(--text-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-faint); }
  .wf-list-head .h-meta { font-family: var(--serif); font-size: var(--text-15); font-style: italic; color: var(--fg); line-height: 1; display: flex; align-items: baseline; gap: var(--s-2); }
  .wf-list-head .h-meta b { font-weight: 400; color: var(--accent); font-family: var(--mono); font-style: normal; font-size: var(--text-22); }

  .wf-list-body { flex: 1; overflow-y: auto; padding: var(--s-2); display: flex; flex-direction: column; gap: var(--s-0); }
  .wf-list-body::-webkit-scrollbar { width: 6px; }
  .wf-list-body::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: var(--r-sm); }
  /* Flush list styling for WorkflowRailItem inside the rail */

  /* Canvas */
  .canvas-col { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-1); }
  .canvas-head { flex-shrink: 0; padding: var(--s-4) var(--s-5) var(--s-3); border-bottom: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: var(--s-4); }
  .wf-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--s-1); }
  .wf-name .crumb { font-family: var(--mono); font-size: var(--text-10); color: var(--fg-faint); letter-spacing: 0.1em; text-transform: uppercase; }
  .wf-name h1 { font-family: var(--serif); font-size: var(--text-22); font-style: italic; font-weight: 400; color: var(--fg); letter-spacing: -0.015em; line-height: 1.1; margin: 0; }
  .wf-name h1 em { color: var(--accent); }
  .canvas-controls { display: flex; align-items: center; gap: var(--s-2); }

  .canvas { flex: 1; min-height: 0; position: relative; overflow: auto; background: radial-gradient(circle at center, var(--bg-1) 0%, var(--bg) 100%); }
  .canvas-inner { position: relative; width: 1280px; height: 480px; }
  .canvas-inner::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, var(--line) 0.7px, transparent 1px); background-size: 24px 24px; opacity: 0.6; pointer-events: none; }
  .edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* Active runs strip */
  .runs-strip { flex-shrink: 0; padding: var(--s-3) var(--s-5); border-top: 1px solid var(--line); background: var(--bg); display: flex; align-items: center; gap: var(--s-3); overflow-x: auto; }
  .runs-strip .lbl { font-family: var(--mono); font-size: var(--text-10); color: var(--fg-faint); letter-spacing: 0.14em; text-transform: uppercase; flex-shrink: 0; }
  .strip-run { flex-shrink: 0; display: inline-flex; align-items: center; gap: var(--s-2); padding: var(--s-1h) var(--s-2h); background: var(--bg-1); border: 1px solid var(--line-strong); border-radius: var(--r-sm); cursor: pointer; transition: all var(--t-fast) var(--ease); max-width: 380px; }
  .strip-run:hover { background: var(--bg-2); border-color: var(--fg-faint); }
  .strip-run.sel { background: var(--accent-wash); border-color: color-mix(in oklch, var(--accent) 35%, transparent); }
  .strip-run .run-title { font-family: var(--sans); font-size: var(--text-12); color: var(--fg-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .strip-run .at-step { font-family: var(--mono); font-size: var(--text-10); color: var(--fg-faint); flex-shrink: 0; border-left: 1px solid var(--line); padding-left: var(--s-2); white-space: nowrap; }
  .strip-run .at-step em { font-style: normal; color: var(--step-wait-fg); }
  .runs-summary { flex-shrink: 0; margin-left: var(--s-2); padding-left: var(--s-3); border-left: 1px solid var(--line); color: var(--fg-faint); font-family: var(--mono); font-size: var(--text-10); white-space: nowrap; }

  /* Inspector — floating glass panel (mirrors the chat: detached, full-height,
     frosted, ember spine on the right edge nearest the screen border) */
  .inspector {
    position: absolute; top: var(--s-3); right: var(--s-3); bottom: var(--s-3);
    width: 360px; z-index: 50;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    background: linear-gradient(205deg, color-mix(in oklch, var(--bg-3) 34%, transparent), color-mix(in oklch, var(--bg-2) 28%, transparent));
    -webkit-backdrop-filter: blur(30px) brightness(1.5) saturate(1.6); backdrop-filter: blur(30px) brightness(1.5) saturate(1.6);
    border: 1px solid color-mix(in oklch, var(--fg) 12%, transparent); border-right: 3px solid var(--accent);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-3), -18px 0 44px rgba(0,0,0,0.34), inset 0 1px 0 color-mix(in oklch, var(--fg) 16%, transparent);
  }
  .inspector.closed { display: none; }
  .inspector-head { padding: var(--s-4) var(--s-5) var(--s-3); border-bottom: 1px solid color-mix(in oklch, var(--fg) 8%, transparent); background: color-mix(in oklch, var(--accent-wash) 30%, transparent); position: relative; }
  .inspector-head .pre { font-family: var(--mono); font-size: var(--text-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-faint); margin-bottom: var(--s-1h); }
  .inspector-head .title { font-family: var(--serif); font-size: var(--text-20); font-style: italic; font-weight: 400; color: var(--fg); letter-spacing: -0.01em; line-height: 1.15; }
  .inspector-head .kind-row { display: flex; align-items: center; gap: var(--s-2); margin-top: var(--s-2h); }
  .inspector-body { flex: 1; overflow-y: auto; padding: var(--s-4) var(--s-5) var(--s-5); }
  .inspector-body::-webkit-scrollbar { width: 6px; }
  .inspector-body::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: var(--r-sm); }
  .inspector-body .sub-lbl { font-family: var(--mono); font-size: var(--text-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-faint); margin-top: var(--s-4); margin-bottom: var(--s-1h); }
  .inspector-body .sub-lbl:first-child { margin-top: 0; }
  .inspector-body .prose { font-family: var(--sans); font-size: var(--text-13); line-height: 1.55; color: var(--fg-soft); }

  /* Workflow-mode inspector bits */
  .inspector .wf-shape { display: flex; gap: 1px; height: 6px; border-radius: var(--r-xs); overflow: hidden; }
  .inspector .wf-shape .seg { flex: 1; opacity: 0.7; }
  .inspector .wf-chip { font-family: var(--mono); font-size: var(--text-10); letter-spacing: 0.04em; color: var(--fg-mute); background: color-mix(in oklch, var(--bg-2) 60%, transparent); border: 1px solid var(--line-strong); border-radius: var(--r-xs); padding: 1px var(--s-1h); }
  .wf-xfers { display: flex; flex-direction: column; gap: var(--s-1); }
  .wf-xrow { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-1h) var(--s-2); border-radius: var(--r-sm); cursor: pointer; transition: background var(--t-fast) var(--ease); }
  .wf-xrow:hover { background: color-mix(in oklch, var(--bg-2) 55%, transparent); }
  .wf-xrow .arr { font-family: var(--mono); font-size: var(--text-13); flex-shrink: 0; width: 14px; text-align: center; }
  .wf-xrow .arr.out { color: var(--accent); }
  .wf-xrow .arr.in { color: var(--step-route-fg); }
  .wf-xrow .nm { font-family: var(--sans); font-size: var(--text-13); color: var(--fg); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wf-xrow .cond { font-family: var(--mono); font-size: var(--text-9); color: var(--fg-faint); white-space: nowrap; }
</style>
</head>
<body>

  <div id="root"></div>

  <script src="tasks-data.js"></script>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Component library -->
  <script type="text/babel" src="lib/lib-primitives.jsx"></script>
  <script type="text/babel" src="lib/lib-eventlog.jsx"></script>
  <script type="text/babel" src="lib/lib-surfaces.jsx"></script>
  <script type="text/babel" src="lib/lib-detail.jsx"></script>
  <script type="text/babel" src="lib/lib-graph.jsx"></script>
  <script type="text/babel" src="lib/lib-controls.jsx"></script>
  <script type="text/babel" src="lib/lib-project-switcher.jsx"></script>
  <script type="text/babel" src="lib/lib-palette.jsx"></script>
  <script type="text/babel" src="lib/lib-thread.jsx"></script>
  <script type="text/babel" src="lib/lib-chat.jsx"></script>
  <script type="text/babel" src="lib/lib-theme.jsx"></script>
  <script type="text/babel" src="lib/lib-shell.jsx"></script>
  <!-- Design app -->
  <script type="text/babel" src="lib/design-app.jsx"></script>

  <script>
    // Anti-flash boot: resolve & apply theme before paint. Full control lives in lib-theme.jsx.
    (function(){
      var key = 'hearth-theme';
      var html = document.documentElement;
      function resolve(p){ return p === 'system'
        ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark')
        : p; }
      var pref = 'dark';
      try { pref = localStorage.getItem(key) || 'dark'; } catch(e){}
      html.classList.toggle('theme-light', resolve(pref) === 'light');
    })();
  </script>
</body>
</html>
