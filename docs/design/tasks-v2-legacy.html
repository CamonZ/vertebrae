<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vertebrae · Hearth — Tasks (refined)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    overflow: hidden;
    font-size: 13px;
  }

  /* ──────────────────────────────────────────────────────────
     Top status strip — minimal: project · page · scope · activity
     ────────────────────────────────────────────────────────── */
  .topbar {
    flex-shrink: 0;
    height: 38px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    display: flex; align-items: center; gap: var(--s-4);
    padding: 0 var(--s-4) 0 var(--s-3);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--fg-mute);
  }
  .topbar .brand {
    font-family: var(--serif); font-style: italic; font-size: 15px;
    letter-spacing: -0.01em; color: var(--fg);
    display: flex; align-items: center; gap: 5px;
  }
  .topbar .brand .ember {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
  }
  .topbar .crumb { color: var(--fg-faint); }
  .topbar .crumb .sep { margin: 0 6px; color: var(--fg-ghost); }
  .topbar .crumb .page {
    font-family: var(--serif); font-style: italic;
    font-size: 15px; color: var(--fg);
    letter-spacing: -0.01em; padding-left: 2px;
  }
  .topbar .activity {
    margin-left: auto;
    display: flex; align-items: center; gap: var(--s-3);
  }
  .topbar .activity .live {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent);
    font-weight: 500;
  }
  .topbar .activity .live .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent-glow); }
    50% { opacity: 0.4; box-shadow: 0 0 2px var(--accent-glow); }
  }
  .topbar .activity .total { color: var(--fg-mute); }
  .topbar .activity .total b { color: var(--fg); font-weight: 600; }
  .topbar .kbd {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--fg-faint);
  }
  .topbar .kbd kbd {
    font-family: var(--mono); font-size: 10px;
    padding: 1px 5px;
    background: var(--bg-2); border: 1px solid var(--line-strong);
    border-radius: var(--r-xs); color: var(--fg-mute);
  }

  /* ──────────────────────────────────────────────────────────
     Main app frame
     ────────────────────────────────────────────────────────── */
  .frame {
    flex: 1; display: flex; min-height: 0;
  }

  /* Sidebar */
  .side {
    width: 44px; flex-shrink: 0;
    background: var(--bg);
    border-right: 1px solid var(--line);
    padding: var(--s-2) 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .side .logo {
    width: 28px; height: 28px;
    background: var(--accent); color: var(--bg);
    border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-style: italic; font-size: 16px; font-weight: 500;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .side hr { width: 20px; border: none; border-top: 1px solid var(--line); margin: 2px 0; }
  .side .item {
    width: 28px; height: 28px; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-mute); cursor: pointer;
    transition: all var(--t-fast) var(--ease);
  }
  .side .item:hover { background: var(--bg-1); color: var(--fg); }
  .side .item.active { background: var(--accent-wash); color: var(--accent); position: relative; }
  .side .item.active::before {
    content: ''; position: absolute; left: -8px; top: 4px; bottom: 4px;
    width: 2px; background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
    border-radius: 0 2px 2px 0;
  }
  .side .sys {
    margin-top: auto;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding-bottom: var(--s-2);
    font-family: var(--mono); font-size: 9px; color: var(--fg-faint);
    letter-spacing: 0.08em; text-transform: uppercase;
    writing-mode: vertical-rl; transform: rotate(180deg);
  }
  .side .sys .conn {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 6px color-mix(in oklch, var(--ok) 60%, transparent);
    writing-mode: horizontal-tb; transform: rotate(180deg);
  }

  /* ──────────────────────────────────────────────────────────
     Tasks list column
     ────────────────────────────────────────────────────────── */
  .list-col {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    border-right: 1px solid var(--line);
  }

  /* Filter + search header */
  .list-head {
    flex-shrink: 0;
    padding: var(--s-4) var(--s-5) var(--s-3);
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    display: flex; flex-direction: column; gap: var(--s-3);
  }

  .scope-row {
    display: flex; align-items: center; gap: 2px;
  }
  .scope {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    font-family: var(--sans); font-size: 12px;
    color: var(--fg-mute);
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: all var(--t-fast) var(--ease);
    border: 1px solid transparent;
  }
  .scope:hover { background: var(--bg-1); color: var(--fg); }
  .scope.active {
    background: var(--accent-wash);
    color: var(--accent);
    border-color: color-mix(in oklch, var(--accent) 35%, transparent);
  }
  .scope .n {
    font-family: var(--mono); font-size: 10px;
    padding: 1px 5px;
    background: var(--bg-3);
    border-radius: var(--r-xs);
    color: var(--fg-faint);
  }
  .scope.active .n {
    background: color-mix(in oklch, var(--accent) 25%, var(--bg));
    color: var(--accent);
  }
  .scope.active .n .pulse {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); display: inline-block;
    margin-right: 3px; vertical-align: 1px;
    box-shadow: 0 0 6px var(--accent-glow);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .scope-sep {
    width: 1px; height: 14px; background: var(--line);
    margin: 0 var(--s-2);
  }
  .scope-row .secondary {
    margin-left: auto;
    display: flex; align-items: center; gap: var(--s-2);
    font-family: var(--mono); font-size: 11px; color: var(--fg-faint);
  }
  .scope-row .secondary select {
    background: transparent; border: 1px solid var(--line-strong);
    color: var(--fg-mute); padding: 3px 8px;
    border-radius: var(--r-sm); font-family: var(--mono); font-size: 11px;
    cursor: pointer;
  }
  .scope-row .secondary .icon-btn {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-mute); border-radius: var(--r-sm);
    cursor: pointer;
  }
  .scope-row .secondary .icon-btn:hover { background: var(--bg-1); color: var(--fg); }

  .search-row {
    display: flex; align-items: center;
    gap: var(--s-2);
    padding: 6px var(--s-3);
    background: var(--bg-1);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    transition: all var(--t-fast) var(--ease);
  }
  .search-row:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-wash);
  }
  .search-row svg { color: var(--fg-faint); flex-shrink: 0; }
  .search-row input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--fg); font-family: var(--sans); font-size: 13px;
  }
  .search-row input::placeholder { color: var(--fg-faint); }
  .search-row .hint {
    display: inline-flex; gap: 3px;
    font-family: var(--mono); font-size: 10px;
    color: var(--fg-faint);
  }
  .search-row .hint kbd {
    padding: 1px 5px; background: var(--bg-2);
    border: 1px solid var(--line-strong); border-radius: var(--r-xs);
    color: var(--fg-mute);
  }

  /* ──────────────────────────────────────────────────────────
     The list itself — hierarchical
     ────────────────────────────────────────────────────────── */
  .list {
    flex: 1; overflow-y: auto;
    padding: var(--s-2) 0 var(--s-6);
    position: relative;
  }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 3px; }
  .list::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }

  /* Indent guides — drawn as positioned 1px verticals on the row */
  .row {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: var(--s-3);
    padding: 0 var(--s-5);
    cursor: pointer;
    transition: background var(--t-fast) var(--ease);
  }
  .row:hover { background: color-mix(in oklch, var(--bg-1) 60%, var(--bg)); }
  .row.sel {
    background: var(--accent-wash);
  }
  .row.sel::before {
    content: '';
    position: absolute; left: 0; top: 6px; bottom: 6px;
    width: 3px; background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    border-radius: 0 2px 2px 0;
  }

  /* Indent guide spine */
  .row .indent {
    display: flex; align-items: stretch;
    flex-shrink: 0;
  }
  .row .indent .g {
    width: 18px; align-self: stretch;
    border-right: 1px dashed transparent;
    position: relative;
  }
  /* Show guides only when indented under an open parent */
  .row.l1 .indent .g.l1,
  .row.l2 .indent .g.l1,
  .row.l2 .indent .g.l2 {
    border-right-color: var(--line);
  }

  /* Primary content */
  .row .body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .row .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row .chev {
    width: 10px; font-size: 9px; color: var(--fg-faint); flex-shrink: 0;
    text-align: center;
  }
  .row .glyph {
    width: 14px; flex-shrink: 0; text-align: center;
    font-family: var(--mono); color: var(--fg-mute);
    font-size: 13px; line-height: 1;
  }

  /* Level styling — typographic distinction */
  .row.l0 { padding-top: 10px; padding-bottom: 8px; }
  .row.l0 .title {
    font-family: var(--serif);
    font-style: italic;
    font-size: 18px;
    font-weight: 400;
    color: var(--fg);
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .row.l0 .glyph { color: var(--fg); font-size: 14px; }

  .row.l1 { padding-top: 7px; padding-bottom: 6px; }
  .row.l1 .title {
    font-family: var(--sans); font-size: 13.5px; font-weight: 500;
    color: var(--fg);
    letter-spacing: -0.005em;
  }
  .row.l1 .glyph { color: var(--fg-soft); }

  .row.l2 { padding-top: 5px; padding-bottom: 5px; }
  .row.l2 .title {
    font-family: var(--sans); font-size: 13px; font-weight: 400;
    color: var(--fg-soft);
  }
  .row.l2 .glyph { font-size: 16px; color: var(--fg-faint); line-height: 0.6; }
  .row.l2.sel .title { color: var(--fg); }

  /* Truncate titles */
  .row .title {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0; flex: 1;
  }

  /* Bottom meta row — only on epic + ticket; tasks stay 1-line */
  .row .meta {
    margin-top: 1px;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 10px; color: var(--fg-faint);
    letter-spacing: 0.02em;
  }
  .row .meta .sep { color: var(--fg-ghost); }
  .row .meta .tag {
    color: var(--fg-mute);
    border-bottom: 1px dotted var(--fg-ghost);
    padding-bottom: 0;
  }

  /* Right-side controls — fixed grid for alignment */
  .row .right {
    display: grid;
    grid-template-columns: minmax(140px, auto) 70px 60px;
    gap: var(--s-3);
    align-items: center;
    flex-shrink: 0;
  }
  .row .right .step-slot { display: flex; justify-content: flex-end; }
  .row .right .id-slot {
    font-family: var(--mono); font-size: 10px;
    color: var(--fg-faint);
    text-align: right; opacity: 0;
    transition: opacity var(--t-fast) var(--ease);
  }
  .row:hover .id-slot, .row.sel .id-slot { opacity: 1; }
  .row .right .when {
    font-family: var(--mono); font-size: 10px;
    color: var(--fg-faint); text-align: right;
  }
  .row .right .when.warm { color: var(--accent); font-weight: 500; }

  /* ── Step / state chip ── */
  .step-chip {
    display: inline-flex; align-items: center;
    gap: 5px;
    height: 20px; padding: 0 7px 0 8px;
    font-family: var(--sans); font-size: 11px; font-weight: 500;
    background: var(--bg-2); color: var(--fg-mute);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-xs);
    white-space: nowrap;
    position: relative;
  }
  .step-chip::before {
    content: ''; position: absolute; left: 0; top: -1px; bottom: -1px;
    width: 2px; border-radius: 2px 0 0 2px;
    background: var(--fg-faint);
  }
  .step-chip.execute { color: var(--step-execute-fg); background: color-mix(in oklch, var(--step-execute-wash) 40%, var(--bg-2)); }
  .step-chip.execute::before { background: var(--step-execute); }
  .step-chip.eval { color: var(--step-eval-fg); background: color-mix(in oklch, var(--step-eval-wash) 40%, var(--bg-2)); }
  .step-chip.eval::before { background: var(--step-eval); }
  .step-chip.route { color: var(--step-route-fg); background: color-mix(in oklch, var(--step-route-wash) 40%, var(--bg-2)); }
  .step-chip.route::before { background: var(--step-route); }
  .step-chip.human { color: var(--step-human-fg); background: color-mix(in oklch, var(--step-human-wash) 40%, var(--bg-2)); }
  .step-chip.human::before { background: var(--step-human); }
  .step-chip.wait { color: var(--step-wait-fg); background: color-mix(in oklch, var(--step-wait-wash) 40%, var(--bg-2)); }
  .step-chip.wait::before { background: var(--step-wait); }
  .step-chip.done { color: var(--ok); background: color-mix(in oklch, var(--ok-wash) 35%, var(--bg-2)); }
  .step-chip.done::before { background: var(--ok); }
  .step-chip.backlog { color: var(--fg-mute); }
  .step-chip.backlog::before { background: var(--fg-ghost); }
  .step-chip.live {
    color: var(--accent); background: var(--accent-wash);
    border-color: color-mix(in oklch, var(--accent) 30%, transparent);
  }
  .step-chip.live::before { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  .step-chip .spinner {
    width: 8px; height: 8px;
    border: 1.5px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Workflow shape — horizontal segmented bar on tickets */
  .row.l1 .pipeline {
    display: inline-flex; gap: 1px;
    height: 4px;
    margin-top: 4px; margin-left: 28px;
    width: 140px;
  }
  .pipeline .seg {
    flex: 1; height: 100%;
    border-radius: 0.5px;
    background: var(--bg-4);
  }
  .pipeline .seg.done { background: color-mix(in oklch, var(--ok) 65%, transparent); }
  .pipeline .seg.execute { background: var(--step-execute); }
  .pipeline .seg.eval { background: var(--step-eval); }
  .pipeline .seg.route { background: var(--step-route); }
  .pipeline .seg.human { background: var(--step-human); }
  .pipeline .seg.wait { background: var(--step-wait); }
  .pipeline .seg.live { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }

  /* Selected row's task list — slightly emphasized parent */
  .row.sel.l1 .title { color: var(--fg); }

  /* Priority arrow */
  .pri { font-family: var(--mono); font-size: 12px; font-weight: 700; flex-shrink: 0; opacity: 0.6; }
  .pri.hi { color: var(--err); opacity: 0.9; }
  .pri.md { color: var(--warn); }
  .pri.lo { color: var(--fg-faint); }

  /* ──────────────────────────────────────────────────────────
     Detail panel
     ────────────────────────────────────────────────────────── */
  .detail {
    width: 580px; flex-shrink: 0;
    background: var(--bg-1);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    min-height: 0;
  }

  .detail-head {
    flex-shrink: 0;
    padding: var(--s-4) var(--s-5) var(--s-4);
    border-bottom: 1px solid var(--line);
    background: linear-gradient(to bottom, color-mix(in oklch, var(--accent-wash) 25%, var(--bg-1)), var(--bg-1));
    position: relative;
  }
  .detail-head::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -1px;
    height: 1px; background: linear-gradient(to right, var(--accent), transparent 60%);
    opacity: 0.5;
  }

  .detail-top {
    display: flex; gap: var(--s-3); align-items: flex-start;
  }
  .detail-title {
    flex: 1;
    font-family: var(--serif); font-size: 22px;
    font-weight: 400; line-height: 1.15;
    letter-spacing: -0.015em;
    color: var(--fg);
  }
  .detail-title em { font-style: italic; color: var(--accent); }

  .detail-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .ctrl {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    color: var(--fg-mute); border-radius: var(--r-sm);
    cursor: pointer; background: transparent; border: none;
    transition: all var(--t-fast) var(--ease);
  }
  .ctrl:hover { background: var(--bg-2); color: var(--fg); }
  .ctrl.stop { color: var(--err); }
  .ctrl.stop:hover { background: var(--err-wash); color: var(--err); }

  .detail-id-row {
    margin-top: 12px;
    display: flex; align-items: center; gap: var(--s-2);
    font-family: var(--mono); font-size: 11px;
    color: var(--fg-faint);
  }
  .detail-id-row .id { color: var(--fg-mute); }
  .detail-id-row .sep { color: var(--fg-ghost); }

  /* HERO — single status line replacing 3 cards */
  .hero-status {
    margin-top: var(--s-4);
    padding: var(--s-3) var(--s-4);
    background: var(--bg-2);
    border: 1px solid var(--line-strong);
    border-left: 3px solid var(--step-wait);
    border-radius: var(--r-md);
  }
  .hero-line {
    display: flex; align-items: center; gap: var(--s-3);
    font-family: var(--mono); font-size: 12px;
    color: var(--fg-soft);
  }
  .hero-line .ico {
    color: var(--step-wait-fg);
    display: inline-flex; align-items: center;
  }
  .hero-line .state {
    color: var(--step-wait-fg);
    font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    font-size: 11px;
  }
  .hero-line .sep { color: var(--fg-ghost); }
  .hero-line .runtime { color: var(--accent); font-weight: 500; }
  .hero-line .runtime .secs { font-family: var(--serif); font-style: italic; color: var(--fg); margin-left: 2px; }
  .hero-line .ratio {
    font-family: var(--serif); font-style: italic;
    font-size: 16px; color: var(--fg);
    line-height: 1;
  }
  .hero-line .ratio b { font-weight: 400; color: var(--accent); }

  /* Dot pipeline of children */
  .hero-pipe {
    margin-top: var(--s-3);
    display: flex; align-items: center; gap: 6px;
  }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--bg-3);
    border: 1px solid var(--line-strong);
    flex-shrink: 0;
    position: relative;
    cursor: pointer;
    transition: transform var(--t-fast) var(--ease);
  }
  .dot:hover { transform: scale(1.2); }
  .dot.done { background: var(--ok); border-color: var(--ok); }
  .dot.done::after {
    content: '✓'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: var(--bg); font-weight: 700;
  }
  .dot.execute { background: var(--step-execute); border-color: var(--step-execute); }
  .dot.live {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .dot.queued { background: transparent; border-color: var(--fg-ghost); }
  .hero-pipe .pipe-line {
    flex: 1; height: 1px; background: var(--line-strong);
    min-width: 4px;
  }
  .hero-pipe .pipe-cap {
    margin-left: auto;
    font-family: var(--mono); font-size: 10px;
    color: var(--fg-faint);
  }

  /* Body */
  .detail-body {
    flex: 1; overflow-y: auto; min-height: 0;
  }
  .detail-body::-webkit-scrollbar { width: 6px; }
  .detail-body::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 3px; }

  /* Section accordion */
  .sec {
    border-bottom: 1px solid var(--line);
  }
  .sec.collapsed .sec-inner { display: none; }
  .sec-hd {
    display: flex; align-items: center; gap: var(--s-2);
    padding: 10px var(--s-5);
    cursor: pointer; user-select: none;
    transition: background var(--t-fast) var(--ease);
  }
  .sec-hd:hover { background: color-mix(in oklch, var(--bg-2) 50%, var(--bg-1)); }
  .sec-chev {
    width: 10px; color: var(--fg-faint); font-size: 9px;
    transition: transform var(--t-fast) var(--ease);
    flex-shrink: 0;
  }
  .sec.collapsed .sec-chev { transform: rotate(-90deg); }
  .sec-name {
    font-family: var(--mono); font-size: 10px;
    font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-mute);
  }
  .sec-name.children { color: var(--accent); }
  .sec-count {
    margin-left: auto;
    font-family: var(--mono); font-size: 10px;
    color: var(--fg-faint);
    background: var(--bg-2);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-xs);
    padding: 1px 6px; min-width: 18px;
    text-align: center;
  }
  .sec-inner {
    padding: 0 var(--s-5) var(--s-4);
  }

  /* Children — listed compactly with hue edge */
  .child {
    display: grid;
    grid-template-columns: 16px 1fr auto auto;
    gap: var(--s-3);
    align-items: center;
    padding: 6px 8px 6px 6px;
    margin: 0 -8px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background var(--t-fast) var(--ease);
    border-left: 2px solid transparent;
  }
  .child:hover { background: var(--bg-2); }
  .child .cdot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); justify-self: center;
  }
  .child.execute .cdot { background: var(--step-execute); }
  .child.live .cdot { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
  .child .cname {
    font-size: 13px; color: var(--fg-soft); line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .child .cid {
    font-family: var(--mono); font-size: 10px; color: var(--fg-faint);
  }
  .child .cwhen {
    font-family: var(--mono); font-size: 10px; color: var(--fg-faint);
    min-width: 50px; text-align: right;
  }

  /* Body prose */
  .prose {
    font-family: var(--sans); font-size: 13px; line-height: 1.6;
    color: var(--fg-soft);
  }
  .prose p + p { margin-top: var(--s-2); }
  .prose ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .prose ul li {
    display: flex; gap: 10px;
    padding-left: 0;
  }
  .prose ul li::before {
    content: '';
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0; margin-top: 9px;
    opacity: 0.7;
  }

  .sub-lbl {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--fg-faint);
    margin-top: var(--s-4); margin-bottom: 6px;
  }
  .sub-lbl:first-child { margin-top: 0; }

  /* Field rows (compact) */
  .field-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .field-row:last-child { border-bottom: none; }
  .field-row .k {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--fg-faint);
  }
  .field-row .v {
    font-family: var(--mono); font-size: 11px;
    color: var(--fg-soft);
  }

  /* Traces tease */
  .traces-link {
    display: flex; align-items: center; justify-content: space-between;
    width: calc(100% + var(--s-2));
    margin-left: calc(var(--s-2) * -0.5);
    margin-top: var(--s-3);
    padding: 8px var(--s-3);
    background: transparent;
    border: 1px dashed var(--line-strong);
    border-radius: var(--r-sm);
    font-family: var(--mono); font-size: 11px;
    color: var(--fg-mute);
    cursor: pointer;
    transition: all var(--t-fast) var(--ease);
  }
  .traces-link:hover {
    border-style: solid; border-color: var(--accent);
    color: var(--accent); background: var(--accent-wash);
  }
  .traces-link .arr { font-family: var(--mono); }

  /* Footer action bar */
  .detail-foot {
    flex-shrink: 0;
    padding: var(--s-3) var(--s-5);
    border-top: 1px solid var(--line);
    background: var(--bg-2);
    display: flex; align-items: center; gap: var(--s-2);
  }

  /* page footer caption */
  .caption-strip {
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    padding: 5px var(--s-5);
    font-family: var(--mono); font-size: 10px;
    color: var(--fg-faint);
    letter-spacing: 0.06em;
    background: var(--bg);
    display: flex; align-items: center; gap: var(--s-3);
  }
  .caption-strip .plate { color: var(--accent); }
  .caption-strip em { font-style: italic; color: var(--fg-mute); }

  /* ──────────────────────────────────────────────────────────
     v2 corrections — run-state vs step-kind separation
     ────────────────────────────────────────────────────────── */

  /* Row chip slot — empty for terminal/null run states */
  .row .right .chip-slot {
    display: flex; justify-content: flex-end;
    min-width: 0;
  }
  .row .right .chip-slot:empty { width: 0; }

  /* Reset .right grid to be flexible — chips render iff active */
  .row .right {
    display: flex;
    align-items: center;
    gap: var(--s-3);
    justify-content: flex-end;
  }
  .row .right .when {
    min-width: 50px;
    text-align: right;
    color: var(--fg-faint);
    font-family: var(--mono);
    font-size: 10px;
    white-space: nowrap;
  }

  /* Run-state chip — only Running / Waiting / Queued */
  .run-chip {
    display: inline-flex; align-items: center; gap: 5px;
    height: 20px; padding: 0 8px 0 9px;
    font-family: var(--sans); font-size: 11px; font-weight: 500;
    background: var(--bg-2); color: var(--fg-mute);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-xs);
    white-space: nowrap;
    position: relative;
  }
  .run-chip::before {
    content: ''; position: absolute; left: 0; top: -1px; bottom: -1px;
    width: 2px; border-radius: 2px 0 0 2px;
    background: var(--fg-faint);
  }
  .run-chip.running {
    color: var(--accent);
    background: var(--accent-wash);
    border-color: color-mix(in oklch, var(--accent) 30%, transparent);
  }
  .run-chip.running::before {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
  }
  .run-chip.waiting {
    color: var(--warn);
    background: color-mix(in oklch, var(--warn-wash) 40%, var(--bg-2));
    border-color: color-mix(in oklch, var(--warn) 30%, transparent);
  }
  .run-chip.waiting::before { background: var(--warn); }
  .run-chip.queued {
    color: var(--fg-mute);
  }
  .run-chip.queued::before { background: var(--fg-ghost); }
  .run-chip .spinner {
    width: 8px; height: 8px;
    border: 1.5px solid currentColor; border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  .run-chip .runtime { color: inherit; opacity: 0.8; font-weight: 400; }
  .run-chip.sm {
    height: 17px; padding: 0 6px 0 7px;
    font-size: 10px;
  }
  .run-chip.sm .spinner { width: 7px; height: 7px; }

  /* ID chip — click to copy */
  .id-chip {
    display: inline-flex; align-items: center; gap: 3px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--fg-faint);
    padding: 2px 5px;
    border-radius: var(--r-xs);
    cursor: pointer;
    user-select: none;
    transition: all var(--t-fast) var(--ease);
    line-height: 1;
    position: relative;
    white-space: nowrap;
  }
  .id-chip:hover {
    background: var(--bg-2);
    color: var(--fg-mute);
  }
  .id-chip:active { background: var(--bg-3); }
  .id-chip .copy-mark {
    opacity: 0;
    transition: opacity var(--t-fast) var(--ease);
    color: var(--fg-faint);
    flex-shrink: 0;
  }
  .id-chip:hover .copy-mark { opacity: 1; }
  .id-chip .ok-mark {
    display: none;
    color: var(--ok);
    flex-shrink: 0;
  }
  .id-chip.copied {
    background: color-mix(in oklch, var(--ok-wash) 40%, transparent);
    color: var(--ok);
  }
  .id-chip.copied .copy-mark { display: none; }
  .id-chip.copied .ok-mark { display: inline-block; opacity: 1; }

  /* Selected row should also show the id-chip without needing hover */
  .row.sel .id-chip { color: var(--fg-mute); }
  .row.sel .id-chip .copy-mark { opacity: 0.6; }

  /* Title — dimmed when completed */
  .row .title.done { color: var(--fg-faint); }
  .row.l0 .title.done { font-style: italic; }
  .row.completed { /* whole row tone-down already handled by chip absence */ }

  /* ── Pipeline — kind = hue, state = brightness ── */
  .pipeline {
    display: inline-flex;
    gap: 1px;
    height: 4px;
    width: 120px;
    border-radius: 1px;
    overflow: hidden;
    vertical-align: middle;
  }
  .pipeline .seg {
    flex: 1; height: 100%;
    background: var(--bg-4);
    opacity: 0.4;
    transition: opacity var(--t-base) var(--ease);
  }
  .pipeline .seg.kind-execute { background: var(--step-execute); }
  .pipeline .seg.kind-eval { background: var(--step-eval); }
  .pipeline .seg.kind-route { background: var(--step-route); }
  .pipeline .seg.kind-human { background: var(--step-human); }
  .pipeline .seg.kind-wait { background: var(--step-wait); }
  .pipeline .seg.s-completed { opacity: 1; }
  .pipeline .seg.s-running {
    opacity: 1;
    box-shadow: inset 0 0 0 1px var(--accent), 0 0 6px var(--accent-glow);
  }
  .pipeline .seg.s-waiting { opacity: 0.7; }
  .pipeline .seg.s-queued  { opacity: 0.30; }
  .pipeline .seg.s-cancelled,
  .pipeline .seg.s-stopped { opacity: 0.20; filter: saturate(0.4); }

  /* Per-state breakdown — replaces linear X/Y */
  .row .meta .breakdown {
    display: inline-flex; gap: 6px;
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.02em;
  }

  /* ── Hero dot pellets — no connecting lines (graph, not chain) ── */
  .hero-pipe {
    margin-top: var(--s-3);
    display: flex; align-items: center; gap: 5px;
    flex-wrap: wrap;
  }
  .hero-pipe .pipe-line { display: none; }
  .hero-pipe .pipe-cap {
    margin-left: auto;
    font-family: var(--mono); font-size: 10px;
    color: var(--fg-faint);
  }
  .dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--bg-3);
    border: 1px solid var(--line-strong);
    flex-shrink: 0;
    cursor: pointer;
    transition: transform var(--t-fast) var(--ease);
    position: relative;
  }
  .dot:hover { transform: scale(1.25); }
  .dot.done {
    background: var(--ok);
    border-color: var(--ok);
  }
  .dot.done::after {
    content: '✓'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: var(--bg); font-weight: 700;
  }
  .dot.running {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .dot.waiting {
    background: var(--warn);
    border-color: var(--warn);
  }
  .dot.queued {
    background: transparent;
    border-color: var(--fg-faint);
  }
  .dot.stopped {
    background: var(--fg-ghost);
    border-color: var(--fg-ghost);
    opacity: 0.5;
  }

  /* Hero header tweaks */
  .hero-status {
    margin-top: var(--s-4);
    padding: var(--s-3) var(--s-4);
    background: var(--bg-2);
    border: 1px solid var(--line-strong);
    border-left: 3px solid var(--step-wait);
    border-radius: var(--r-md);
  }
  .hero-line { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--fg-soft); }
  .hero-line .state { font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
  .hero-line .sep { color: var(--fg-ghost); }
  .hero-line .runtime { color: var(--accent); font-weight: 500; }
  .hero-line .step-pos { font-family: var(--mono); font-size: 11px; }
  .hero-breakdown {
    margin-top: var(--s-2);
    font-family: var(--mono); font-size: 11px;
    color: var(--fg-faint);
    display: flex; flex-wrap: wrap; gap: 6px;
  }

  /* Children section — restyle child rows */
  .child {
    display: grid;
    grid-template-columns: 10px 1fr auto;
    gap: var(--s-3);
    align-items: center;
    padding: 6px 8px 6px 6px;
    margin: 0 -8px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background var(--t-fast) var(--ease);
  }
  .child:hover { background: var(--bg-2); }
  .child .cdot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--fg-faint);
    justify-self: center;
  }
  .child .cname {
    font-size: 13px; color: var(--fg-soft); line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .child .cright {
    display: inline-flex; align-items: center; gap: 6px;
    flex-shrink: 0;
  }

  /* Dependency row */
  .dep-row {
    display: flex; align-items: center; gap: var(--s-2);
    padding: 6px 8px; margin: 0 -8px;
    border-radius: var(--r-sm);
    cursor: pointer;
  }
  .dep-row:hover { background: var(--bg-2); }
  .dep-row .dep-title {
    font-family: var(--sans); font-size: 12px;
    color: var(--fg-soft); font-style: italic;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Detail panel id chip — slightly larger */
  .detail-id-row .id-chip {
    font-size: 11px; padding: 2px 6px;
  }

  /* Suppress the old .step-chip variants (left intact in case) */
</style>
</head>
<body>

  <!-- Top status strip — single line, no double-meta clutter -->
  <div class="topbar">
    <span class="brand">Vertebrae<span class="ember"></span></span>
    <span class="crumb">sacrum <span class="sep">›</span> <span class="page">Tasks</span></span>
    <div class="activity">
      <span class="live" id="activityLive"></span>
      <span class="total" id="activityTotal"></span>
      <span class="kbd"><kbd>⌘</kbd><kbd>K</kbd></span>
    </div>
  </div>

  <div class="frame">

    <!-- Sidebar -->
    <aside class="side">
      <div class="logo">s</div>
      <hr>
      <div class="item" title="Operations">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <a class="item" href="board-v2.html" title="Board">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>
      </a>
      <div class="item active" title="Tasks">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </div>
      <div class="item" title="Design">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="3"/><circle cx="19" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><path d="m7 8 4 8M17 8l-4 8"/></svg>
      </div>
      <div class="item" title="Traces">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
      </div>

      <div class="sys">
        <span class="conn" title="Connected"></span>
        <span>connected</span>
      </div>
    </aside>

    <!-- Tasks list column -->
    <main class="list-col">

      <div class="list-head">
        <div class="scope-row">
          <div id="scopeChips" style="display:flex;gap:2px;align-items:center;flex-wrap:wrap;"></div>
          <div class="secondary">
            <select id="levelFilter">
              <option>All levels</option>
              <option>Epics only</option>
              <option>Tickets</option>
              <option>Tasks</option>
            </select>
            <span class="icon-btn" id="expandAllBtn" title="Expand all">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </span>
          </div>
        </div>

        <div class="search-row">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search" placeholder="Search tasks by title, id, or tag…">
          <span class="hint"><kbd>/</kbd></span>
        </div>
      </div>

      <!-- Hierarchical task list — rendered by tasks-v2.js -->
      <div class="list" id="list"></div>

      <!-- Footer caption — design system note -->
      <div class="caption-strip">
        <span class="plate">⊹ tasks · v2</span>
        <em>hierarchy ledger · workflow shape · ember on the live</em>
      </div>
    </main>

    <!-- Detail panel — rendered by tasks-v2.js -->
    <aside class="detail" id="detail"></aside>

  </div>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="hearthThemeToggle" aria-label="Toggle light/dark">
    <span class="sym">☾</span>
    <span class="knob"></span>
    <span class="sym">☀</span>
  </button>

  <script src="tasks-data.js"></script>
  <script src="tasks-v2.js"></script>
  <script>
    (function(){
      var key = 'hearth-theme';
      var html = document.documentElement;
      try { if(localStorage.getItem(key) === 'light') html.classList.add('theme-light'); } catch(e){}
      var btn = document.getElementById('hearthThemeToggle');
      btn.addEventListener('click', function(){
        var isLight = html.classList.toggle('theme-light');
        try { localStorage.setItem(key, isLight ? 'light' : 'dark'); } catch(e){}
      });
    })();
  </script>
</body>
</html>
